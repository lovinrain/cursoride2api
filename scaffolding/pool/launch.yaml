# RATLC pool launch configuration.
#
# Edit this file to change the env vars exported when `launch.sh` brings the
# pool up. Format is a flat YAML mapping (KEY: value). Comments start with `#`.
# Values are exported verbatim — surround with quotes if they contain shell
# metacharacters or spaces.
#
# Override on the command line by prefixing the launch:
#   POOL_SIZE=20 ./launch.sh up           # overrides POOL_SIZE for this run
#   ./launch.sh up 20                     # equivalent (ratlc.mjs takes args[0])
#
# After editing this file, restart the pool with `./launch.sh up`.

# ── Pool sizing & concurrency ──────────────────────────────────────────────
POOL_SIZE: 10                                  # number of channels to maintain
POOL_CONCURRENT_OPENS: 30                      # max channel opens running in parallel during cold start
POOL_MODEL: claude-opus-4-8-thinking-max-fast,claude-4.6-opus-max-thinking-fast

# ── Tool & context handling ────────────────────────────────────────────────
POOL_TOOL_MODE: translate                      # contract | translate (claude-code uses translate)
POOL_CONTEXT_MODE: full                        # last | full (full re-renders history every turn)
POOL_BRIDGE_PROTOCOL: h1                       # h1 | h2 — h1 is the validated path

# ── Thinking / re-injection ────────────────────────────────────────────────
POOL_REINJECT_THINKING: 1                      # capture upstream thinking, re-inject into next turn
POOL_REINJECT_THINKING_MAX_TURNS: 5            # cap on stored thinking turns per conv
MAX_THINKING_TOKENS: 32000                     # upper bound for the model's thinking budget

# ── Retry behavior on rate-limit during channel open ───────────────────────
RATLC_RETRY_MODE: constant                     # constant | aimd
RATLC_CONSTANT_INTERVAL_MS: 500                # interval between attempts in constant mode

# ── Cursor backend native passthrough ──────────────────────────────────────
# Required for native WebSearch (PR #1's webSearchToolCall surfacing). With
# this OFF the bridge rejects InteractionQuery requests and the model falls
# back to the spoof / confabulation path. Always keep this on.
RATLC_PASSTHROUGH_NATIVE: 1

# Emit a visible `[Cursor WebSearch] <query>` text delta in the SSE stream so
# you can see in claude-code's TUI when Cursor backend ran a search. Set to 0
# to keep the SSE clean and rely on the `server_tool_use` content block alone.
RATLC_RENDER_SERVER_TOOL_TEXT: 1

# Allow `curl`, `wget`, etc. in Bash/Shell tool calls. PR #1 added a regex
# in src/cursor-agent.js that REJECTS any shell command matching common
# network tools when this is unset — intent was to force the model toward
# Cursor-native WebSearch instead of curl-based workarounds. But the regex
# blocks legitimate `curl http://localhost/...` ops/diagnostics too.
# Set to 1 to keep curl/wget working; the system-prompt steering still
# nudges the model toward native WebSearch for broad search.
CURSOR_ALLOW_LOCAL_SHELL_NETWORK: 1

# ── OS fingerprint (token-machine binding) ─────────────────────────────────
# token.json was minted on macOS; Cursor's backend rate-limits hard when the
# fingerprint doesn't match the running OS. On Linux hosts you MUST set this
# to `darwin` (see memory: project_token_machine_os_fingerprint.md).
CURSOR_CLIENT_OS: darwin

# ── api-server HTTP bind ───────────────────────────────────────────────────
# 0.0.0.0 = reachable from any interface (LAN / WAN if firewall permits).
# 127.0.0.1 = localhost only. The API is unauthenticated; only expose to
# untrusted networks when you understand the implications.
RATLC_API_HOST: 0.0.0.0

# ── Auto-retry on transient upstream failures ──────────────────────────────
# Two distinct symptoms can be auto-retried server-side. See
# UPSTREAM_RETRY_DESIGN.md for the full design + cost model.
#
# upstream_silent_timeout — pool routed, Cursor accepted the bidi frame, then
#   RATLC_NO_VISIBLE_EVENT_TIMEOUT_MS passed with no text/thinking/tool_use/
#   yield/error. Usually transient (unknown exec message, slow Cursor). A fresh
#   channel typically succeeds. Retry cancels the stuck channel + replays.
#
# empty_assistant_turn — Cursor cleanly ended the turn but the model produced
#   zero visible content. Retry overrides sessionKey to force a different
#   channel (otherwise affinity routes back to the same one which produced
#   the empty output). Always retries up to budget regardless of thinking —
#   empty visible output is a degraded outcome either way.
#
# Both default off (MAX=0). Enable cautiously — each retry burns one Cursor
# turn worth of quota and adds NO_VISIBLE_EVENT_TIMEOUT_MS to worst-case
# client latency. Recommended starting values: SILENT=2, EMPTY=1.
RATLC_RETRY_UPSTREAM_SILENT_MAX: 2             # 0=off, N=up to N retries on silent timeout
RATLC_RETRY_EMPTY_TURN_MAX: 3                  # 0=off, N=up to N retries on empty turn (raised 1→3 2026-06-07: empty turns recur under load; the breadcrumb no longer fools the empty-check so the budget is now actually usable, and exhaustion shows a clear "retries exhausted" message instead of a bare "auto-retrying" line)
# upstream_abort — transient upstream error (Cursor "Response error: aborted",
# stale channel death, NGHTTP2 reset) BEFORE any client-visible content. Left
# unhandled it surfaces to claude-code as "API returned an empty or malformed
# response (HTTP 200)" or a manual-retry notice. Retry replays on a FRESH
# channel (sessionKey nulled to dodge the stale sticky). Only fires before
# content + for transient errors (never auth/quota/rate-limit). Common during
# Cursor throttle storms. 0=off.
RATLC_RETRY_UPSTREAM_ABORT_MAX: 2              # 0=off, N=up to N retries on pre-content upstream abort
# continue_after_abort — upstream aborts mid-TEXT (after some text was already
# shown). Can't replay (would duplicate shown text), so instead self-drive a
# CONTINUATION: keep the SSE message open, ask a fresh channel to continue from
# the partial, stream it into the same message. Replaces the "Send a new message
# to continue" notice with seamless continuation. 0=off. (Quality note: the
# continuation is a fresh generation conditioned on the partial — usually
# seamless, but may occasionally re-phrase the join; set 0 if undesirable.)
RATLC_RETRY_CONTINUE_AFTER_ABORT_MAX: 2        # 0=off, N=up to N self-driven continuations per turn

# ── Time-to-first-byte patience (Option A: wait-and-reuse over kill-and-retry) ─
# This watchdog is a TIME-TO-FIRST-BYTE gate, NOT a generation cap — it disarms
# permanently on the first visible event, so raising it only gives slow-STARTING
# turns room (huge full-mode payloads on a throttled backend routinely take >25s
# to first token). The upstream HTTP stall layer already tolerates 10min pre-
# content / 30min post (CURSOR_STALL_TIMEOUT_MS, set in translate mode), and the
# keep-alive ping below feeds the client's read timer, so a multi-minute wait is
# viable end-to-end. A channel that finally returns is NOT killed — it goes back
# to the ready pool for reuse, which matters because opens are very expensive
# under throttle (200+ attempts / ~8min observed). Cost: a GENUINELY hung channel
# now blocks for the full window before retry; worst-case hung latency is
# window × (SILENT_MAX+1) = 5min × 3 = 15min with SILENT=2. The forthcoming
# liveness gate (Option B, RATLC_NO_VISIBLE_LIVENESS_GRACE_MS) abandons channels
# that are truly silent at the socket early, so the long ceiling only applies to
# channels showing signs of life — deploy A+B together, or drop SILENT to 1 if
# running A alone. (was default 25000)
RATLC_NO_VISIBLE_EVENT_TIMEOUT_MS: 300000      # first-byte patience CEILING (5min) — max total wait even while upstream frames keep arriving
# Option B (liveness gate): abandon early if NO raw upstream frame arrives for
# this long, regardless of the ceiling above. The worker emits a `progress`
# breadcrumb on every raw upstream frame (the same signal the HTTP stall
# detector trusts) before the first visible event; this timer resets on each
# one and fires only after true wire silence. So a slow-but-alive channel is
# waited on (up to the 5min ceiling) and reused, while a genuinely hung channel
# is reaped at ~90s. Worst-case hung latency ≈ grace × (SILENT_MAX+1) ≈ 270s.
# Set 0 to disable → pure ceiling behavior (Option A).
RATLC_NO_VISIBLE_LIVENESS_GRACE_MS: 90000      # liveness-gap: hung if no raw frame for 90s
# RATLC_RETRY_DELAY_MS: 500                    # backoff between retries
# RATLC_RETRY_EMIT_NOTICE: 1                   # tell client (one notice) on first retry
# stale tool_result recovery: when the client (re)sends a tool_result the pool
# can't honor (already consumed / unknown id — typically a claude-code
# double-submit or a "continue" after a desynced turn), replay the full
# conversation as a fresh send_user_message so the model continues, instead of
# dead-ending with a notice the client can't act on. Default 1 (on); 0 = old
# dead-end-notice behavior. See DEVLOG 2026-05-25.
# RATLC_RETRY_STALE_TOOL_RESULT_MAX: 1

# ── Keep-alive ping ────────────────────────────────────────────────────────
# After message_start we can sit silent for many seconds waiting on Cursor's
# first token (large full-mode payloads are slow to first-byte). The wire goes
# quiet and the CLIENT's read-idle timeout fires BEFORE our 25s watchdog — so
# claude-code aborts with "API returned an empty or malformed response (HTTP
# 200)" and the silent-timeout retry never gets to run. A recurring SSE ping
# (same event Anthropic interleaves) keeps the client's read timer fed. The
# ping runs from message_start until the turn finishes, including across
# retries. Default 3000ms; set 0 to disable.
# RATLC_KEEPALIVE_PING_MS: 3000

# ── Optional diagnostic toggles (leave commented unless debugging) ────────
# CURSOR_LOG_NATIVE_EXEC: 1                    # log every ExecServerMessage case
# CURSOR_LOG_INTERACTION: 1                    # log every InteractionQuery decision (approve/reject/abandon)
# POOL_TOOL_USE_WATCHDOG_MS: 1000              # parallel-tools finalize watchdog (default 1000)
RATLC_BUSY_STUCK_TIMEOUT_MS: 360000            # busy-watchdog reap threshold (6min) — MUST exceed NO_VISIBLE ceiling (5min) above, else it SIGTERMs the slow-but-alive channel at 4min before first byte (default was 240000)
# RATLC_TOKEN_DEATH_THRESHOLD: 3               # strikes before a token gets marked dead on `other_error`
# LOG_REQUEST_TOOLS: 1                         # log incoming /v1/messages tools list
# POOL_REINJECT_THINKING_DEBUG: 1              # enables POST /v1/_debug/render endpoint used by test_render.sh
