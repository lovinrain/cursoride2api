# RATLC pool launch configuration.
#
# Edit this file to change the env vars exported when `launch.sh` brings the
# pool up. Format is a flat YAML mapping (KEY: value). Comments start with `#`.
# Values are exported verbatim — surround with quotes if they contain shell
# metacharacters or spaces.
#
# Override on the command line by prefixing the launch:
#   POOL_SIZE=20 ./launch.sh up           # overrides POOL_SIZE for this run
#   ./launch.sh up 20                     # equivalent (ratlc.mjs takes args[0])
#
# After editing this file, restart the pool with `./launch.sh up`.

# ── Pool sizing & concurrency ──────────────────────────────────────────────
POOL_SIZE: 10                                  # number of channels to maintain
POOL_CONCURRENT_OPENS: 30                      # max channel opens running in parallel during cold start
POOL_MODEL: claude-opus-4-7-thinking-max-fast,claude-4.6-opus-max-thinking-fast

# ── Tool & context handling ────────────────────────────────────────────────
POOL_TOOL_MODE: translate                      # contract | translate (claude-code uses translate)
POOL_CONTEXT_MODE: full                        # last | full (full re-renders history every turn)
POOL_BRIDGE_PROTOCOL: h1                       # h1 | h2 — h1 is the validated path

# ── Thinking / re-injection ────────────────────────────────────────────────
POOL_REINJECT_THINKING: 1                      # capture upstream thinking, re-inject into next turn
POOL_REINJECT_THINKING_MAX_TURNS: 5            # cap on stored thinking turns per conv
MAX_THINKING_TOKENS: 32000                     # upper bound for the model's thinking budget

# ── Retry behavior on rate-limit during channel open ───────────────────────
RATLC_RETRY_MODE: constant                     # constant | aimd
RATLC_CONSTANT_INTERVAL_MS: 500                # interval between attempts in constant mode

# ── Cursor backend native passthrough ──────────────────────────────────────
# Required for native WebSearch (PR #1's webSearchToolCall surfacing). With
# this OFF the bridge rejects InteractionQuery requests and the model falls
# back to the spoof / confabulation path. Always keep this on.
RATLC_PASSTHROUGH_NATIVE: 1

# Emit a visible `[Cursor WebSearch] <query>` text delta in the SSE stream so
# you can see in claude-code's TUI when Cursor backend ran a search. Set to 0
# to keep the SSE clean and rely on the `server_tool_use` content block alone.
RATLC_RENDER_SERVER_TOOL_TEXT: 1

# Allow `curl`, `wget`, etc. in Bash/Shell tool calls. PR #1 added a regex
# in src/cursor-agent.js that REJECTS any shell command matching common
# network tools when this is unset — intent was to force the model toward
# Cursor-native WebSearch instead of curl-based workarounds. But the regex
# blocks legitimate `curl http://localhost/...` ops/diagnostics too.
# Set to 1 to keep curl/wget working; the system-prompt steering still
# nudges the model toward native WebSearch for broad search.
CURSOR_ALLOW_LOCAL_SHELL_NETWORK: 1

# ── OS fingerprint (token-machine binding) ─────────────────────────────────
# token.json was minted on macOS; Cursor's backend rate-limits hard when the
# fingerprint doesn't match the running OS. On Linux hosts you MUST set this
# to `darwin` (see memory: project_token_machine_os_fingerprint.md).
CURSOR_CLIENT_OS: darwin

# ── api-server HTTP bind ───────────────────────────────────────────────────
# 0.0.0.0 = reachable from any interface (LAN / WAN if firewall permits).
# 127.0.0.1 = localhost only. The API is unauthenticated; only expose to
# untrusted networks when you understand the implications.
RATLC_API_HOST: 0.0.0.0

# ── Auto-retry on transient upstream failures ──────────────────────────────
# Two distinct symptoms can be auto-retried server-side. See
# UPSTREAM_RETRY_DESIGN.md for the full design + cost model.
#
# upstream_silent_timeout — pool routed, Cursor accepted the bidi frame, then
#   >25s passed with no text/thinking/tool_use/yield/error. Usually transient
#   (unknown exec message, slow Cursor). A fresh channel typically succeeds.
#   Retry cancels the stuck channel + replays the original payload.
#
# empty_assistant_turn — Cursor cleanly ended the turn but the model produced
#   zero visible content. Less reliably transient (model may have legitimately
#   decided to say nothing); retry overrides sessionKey to force a different
#   channel. By default we SKIP retry when the model captured substantive
#   thinking (set IGNORE_THINKING=1 to retry anyway).
#
# Both default off (MAX=0). Enable cautiously — each retry burns one Cursor
# turn worth of quota and adds NO_VISIBLE_EVENT_TIMEOUT_MS to worst-case
# client latency. Recommended starting values: SILENT=2, EMPTY=1.
RATLC_UPSTREAM_SILENT_RETRY_MAX: 2             # 0=off, N=up to N retries on silent timeout
RATLC_EMPTY_TURN_RETRY_MAX: 1                  # 0=off, N=up to N retries on empty turn
# RATLC_EMPTY_TURN_RETRY_IGNORE_THINKING: 0    # 1=retry even if model captured thinking
# RATLC_RETRY_DELAY_MS: 500                    # backoff between retries
# RATLC_RETRY_EMIT_NOTICE: 1                   # tell client (one notice) on first retry

# ── Optional diagnostic toggles (leave commented unless debugging) ────────
# CURSOR_LOG_NATIVE_EXEC: 1                    # log every ExecServerMessage case
# CURSOR_LOG_INTERACTION: 1                    # log every InteractionQuery decision (approve/reject/abandon)
# POOL_TOOL_USE_WATCHDOG_MS: 1000              # parallel-tools finalize watchdog (default 1000)
# RATLC_BUSY_STUCK_TIMEOUT_MS: 240000          # busy-watchdog reap threshold (default 240s)
# RATLC_TOKEN_DEATH_THRESHOLD: 3               # strikes before a token gets marked dead on `other_error`
# LOG_REQUEST_TOOLS: 1                         # log incoming /v1/messages tools list
# POOL_REINJECT_THINKING_DEBUG: 1              # enables POST /v1/_debug/render endpoint used by test_render.sh
